const monthName=d=>d.toLocaleDateString('id-ID',{month:'long',year:'numeric'});

let supabaseClient=null, currentUser=null, dbReady=false, remoteTimer=null, applyingRemote=false, authMode='login', realtimeChannel=null;
const WORKSPACE_ID='gadoeh-rasa-main';
function localSave(){localStorage.setItem(STORE,JSON.stringify(state));$('#sideBrand').textContent=state.setup.brand||'Gadoeh Rasa'}
function save(){
 localSave();
 if(!dbReady||!currentUser||!supabaseClient||applyingRemote)return;
 clearTimeout(remoteTimer);
 remoteTimer=setTimeout(async()=>{
  try{
   const {error}=await supabaseClient.from('workspace_state').upsert({
    id:WORKSPACE_ID,
    data:state,
    updated_at:new Date().toISOString(),
    updated_by:currentUser.id
   });
   if(error)throw error;
   setSyncStatus('Tersimpan ke database bersama');
  }catch(e){setSyncStatus('Gagal sinkron: '+(e.message||e));console.error(e)}
 },650);
}
function setSyncStatus(message){let el=$('#syncStatus');if(el)el.textContent=message}
function showAuth(message=''){
 $('#authGate').style.display='flex';
 $('#authStatus').textContent=message;
 $('#accountButton').style.display='none';
}
function hideAuth(){
 $('#authGate').style.display='none';
 $('#accountButton').style.display='inline-flex';
}
async function loadWorkspace(){
 setSyncStatus('Mengambil data workspace…');
 const {data,error}=await supabaseClient.from('workspace_state').select('data').eq('id',WORKSPACE_ID).maybeSingle();
 if(error)throw error;
 if(data&&data.data){
  applyingRemote=true;state=data.data;
  state.marketplace=state.marketplace||[];state.kol=state.kol||[];
  localSave();applyingRemote=false;
 }else{
  const {error:insertError}=await supabaseClient.from('workspace_state').insert({
   id:WORKSPACE_ID,data:state,updated_at:new Date().toISOString(),updated_by:currentUser.id
  });
  if(insertError)throw insertError;
 }
 dbReady=true;render();setSyncStatus('Tersimpan di Supabase');
}
function setupRealtime(){
 if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
 realtimeChannel=supabaseClient.channel('gadoeh-rasa-workspace')
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'workspace_state',filter:`id=eq.${WORKSPACE_ID}`},payload=>{
   if(payload.new?.data&&payload.new.updated_by!==currentUser?.id){
    applyingRemote=true;state=payload.new.data;state.marketplace=state.marketplace||[];state.kol=state.kol||[];
    localSave();applyingRemote=false;render();setSyncStatus('Data diperbarui oleh anggota tim');
   }
  }).subscribe();
}
async function initSupabase(){
 const url=window.GADOEH_SUPABASE_URL, key=window.GADOEH_SUPABASE_ANON_KEY;
 if(!url||!key||url.includes('YOUR_PROJECT')||key.includes('YOUR_SUPABASE')){
  showAuth('Supabase belum dikonfigurasi. Isi Project URL dan anon/publishable key di file supabase-config.js, lalu upload ulang ke GitHub.');
  return;
 }
 if(!window.supabase?.createClient){showAuth('Library Supabase gagal dimuat. Periksa koneksi internet.');return}
 supabaseClient=window.supabase.createClient(url,key);
 const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
 if(sessionError)throw sessionError;
 supabaseClient.auth.onAuthStateChange((_event,newSession)=>{
  // Jalankan operasi database di luar callback auth agar tidak menahan lock internal Supabase.
  setTimeout(async()=>{
   if(newSession?.user){
    currentUser=newSession.user;hideAuth();
    try{await loadWorkspace();setupRealtime()}catch(e){dbReady=false;showAuth('Tidak bisa membuka database: '+e.message)}
   }else{
    currentUser=null;dbReady=false;
    if(realtimeChannel){supabaseClient.removeChannel(realtimeChannel);realtimeChannel=null}
    showAuth('Silakan login menggunakan akun workspace tim.');
   }
  },0);
 });
 if(session?.user){currentUser=session.user;hideAuth();try{await loadWorkspace();setupRealtime()}catch(e){dbReady=false;showAuth('Tidak bisa membuka database: '+e.message)}}
 else showAuth();
}
function initAuthControls(){
 $('#authToggle').onclick=()=>{
  authMode=authMode==='login'?'signup':'login';
  $('#authTitle').textContent=authMode==='login'?'Masuk ke Workspace':'Buat Akun Workspace';
  $('#authDescription').textContent=authMode==='login'?'Login untuk mengakses data tim Gadoeh Rasa yang tersimpan di Supabase.':'Buat akun dengan email dan password. Jika konfirmasi email aktif, cek inbox untuk verifikasi.';
  $('#authSubmit').textContent=authMode==='login'?'Masuk':'Daftar';
  $('#authToggle').textContent=authMode==='login'?'Buat akun tim':'Kembali ke login';
  $('#authPassword').autocomplete=authMode==='login'?'current-password':'new-password';
 };
 $('#authSubmit').onclick=async()=>{
  const email=$('#authEmail').value.trim(),password=$('#authPassword').value;
  if(!email||password.length<6){$('#authStatus').textContent='Masukkan email dan password minimal 6 karakter.';return}
  $('#authSubmit').disabled=true;$('#authStatus').textContent='Memproses…';
  try{
   let result=authMode==='login'
    ?await supabaseClient.auth.signInWithPassword({email,password})
    :await supabaseClient.auth.signUp({email,password});
   if(result.error)throw result.error;
   if(authMode==='signup'&&!result.data.session)$('#authStatus').textContent='Akun dibuat. Cek email untuk verifikasi, lalu login.';
   else $('#authStatus').textContent='Berhasil. Membuka workspace…';
  }catch(e){$('#authStatus').textContent=e.message||'Terjadi kesalahan.'}
  finally{$('#authSubmit').disabled=false}
 };
 $('#accountButton').onclick=async()=>{
  if(!confirm('Keluar dari Workspace Gadoeh Rasa?'))return;
  dbReady=false;if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
  await supabaseClient.auth.signOut();
 };
}

function renderPreview(){let rows=state.ig.filter(x=>x.headline||x.caption);$('#view').innerHTML=header('Content Preview','Tinjau draft caption dan ide konten sebelum dipublikasikan.')+`<div class="notice">Sheet Content Preview pada spreadsheet merupakan tampilan preview berbasis tanggal. Di versi website ini, preview ditampilkan dari draft yang tersimpan di Instagram Content Plan.</div><div class="previewgrid">${rows.length?rows.map(x=>`<article class="preview"><div class="previewimg">${x.image?`<img src="${esc(x.image)}" style="width:100%;height:145px;object-fit:cover">`:'📷'}</div><div class="previewbody">${pill(x.status)}<p>${fmtDate(x.date)} · ${esc(x.platform||'Instagram')}</p><b>${esc(x.headline||'Draft konten')}</b><p>${esc([x.caption,x.cta,x.hashtag].filter(Boolean).join(' ')).slice(0,220)||'Belum ada caption.'}</p></div></article>`).join(''):'<div class="empty">Belum ada draft Instagram. Tambahkan konten di Instagram Content Plan untuk melihat preview.</div>'}</div>`}
function dailyInsightChart(rows,year,month,metric){
 const days=new Date(year,month,0).getDate(),values=Array.from({length:days},(_,i)=>0);
 rows.forEach(x=>{if(!x.date)return;let d=new Date(x.date+'T00:00:00');if(d.getFullYear()===year&&d.getMonth()+1===month)values[d.getDate()-1]+=Number(x[metric])||0});
 const W=900,H=260,L=58,R=18,T=18,B=38,plotW=W-L-R,plotH=H-T-B,max=Math.max(1,...values),step=max/4;
 const pts=values.map((v,i)=>[L+(days===1?0:i*plotW/(days-1)),T+plotH-(v/max)*plotH]);
 const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 const grid=[0,1,2,3,4].map(i=>{let y=T+plotH-i*plotH/4,val=Math.round(step*i);return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#eee8df"/><text x="${L-10}" y="${y+4}" text-anchor="end" fill="#938b80" font-size="10">${val.toLocaleString('id-ID')}</text>`}).join('');
 const labels=values.map((v,i)=>i===0||i===days-1||(i+1)%5===0?`<text x="${pts[i][0]}" y="${H-12}" text-anchor="middle" fill="#938b80" font-size="10">${i+1}</text>`:'').join('');
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik harian ${metric}" style="width:100%;height:auto;display:block">${grid}<path d="${path}" fill="none" stroke="#ed8c44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#ed8c44"><title>${i+1}: ${values[i].toLocaleString('id-ID')}</title></circle>`).join('')}${labels}</svg>`;
}
function renderReport(){
 const now=new Date(),defaultYear=now.getFullYear(),defaultMonth=now.getMonth()+1;
 let month=Number($('#reportMonth')?.value||defaultMonth),year=Number($('#reportYear')?.value||defaultYear);
 let monthKey=`${year}-${String(month).padStart(2,'0')}`;
 let completed=state.ig.filter(x=>x.workflowStatus==='Selesai'&&x.date&&x.date.startsWith(monthKey));
 let campaigns=state.marketing.filter(x=>x.date&&x.date.startsWith(monthKey));
 let sum=k=>completed.reduce((a,x)=>a+(Number(x[k])||0),0);
 let metricKeys=['reach','views','likes','comments','shares','saves'];
 let metricLabels={reach:'Reach',views:'Views',likes:'Likes',comments:'Comments',shares:'Shares',saves:'Saves'};
 let cards=metricKeys.map(k=>stat(metricLabels[k],sum(k).toLocaleString('id-ID'),'Konten berstatus Selesai','◎')).join('');
 let contentRows=completed.length?completed.map(x=>{let idx=state.ig.indexOf(x);return `<tr><td>${fmtDate(x.date)}</td><td><b>${esc(x.headline||'Tanpa judul')}</b><div class="muted">${esc(x.platform||'—')}</div></td><td>${esc(x.format||'—')}</td>${metricKeys.map(k=>`<td style="text-align:right">${(Number(x[k])||0).toLocaleString('id-ID')}</td>`).join('')}<td><button class="btn small" onclick="openInsightForm(${idx})">Input / Edit insight</button></td></tr>`}).join(''):`<tr><td colspan="10"><div class="empty">Belum ada Content Plan berstatus Selesai pada bulan ini.</div></td></tr>`;
 let years=Array.from({length:1001},(_,i)=>2000+i);if(!years.includes(year))years.push(year);years.sort((a,b)=>a-b);
 let monthOptions=SEED.options.month.map((m,i)=>`<option value="${i+1}" ${month===i+1?'selected':''}>${m}</option>`).join('');
 let yearOptions=years.map(y=>`<option value="${y}" ${year===y?'selected':''}>${y}</option>`).join('');
 $('#view').innerHTML=header('Monthly Report','Laporan performa bulanan. Insight hanya dihitung dari Content Plan Social Media yang berstatus Selesai.',`<div class="toolbar"><select class="field" id="reportMonth">${monthOptions}</select><select class="field" id="reportYear">${yearOptions}</select><button class="btn" id="applyReportPeriod">Terapkan periode</button></div>`)
 +`<div class="cards">${stat('Konten selesai',completed.length,'Content Plan pada bulan terpilih','✓')}${stat('Total campaign marketing',campaigns.length,'Plan Marketing pada bulan terpilih','◈')}${stat('Total interaksi',(sum('likes')+sum('comments')+sum('shares')+sum('saves')).toLocaleString('id-ID'),'Likes + comments + shares + saves','♡')}${stat('Platform aktif',new Set(completed.map(x=>x.platform).filter(Boolean)).size,'Konten selesai bulan ini','▣')}</div>
 <div class="cards">${cards}</div>
 <div class="panel" style="margin-bottom:16px"><div class="panelhead"><div><h3>Grafik Insight Harian</h3><small>Akumulasi insight per tanggal dari konten berstatus Selesai</small></div><select class="field" id="chartMetric">${metricKeys.map(k=>`<option value="${k}">${metricLabels[k]}</option>`).join('')}</select></div><div id="dailyChart">${dailyInsightChart(completed,year,month,'reach')}</div><div class="legend"><span><i class="dot"></i><span id="chartLegend">Reach per hari</span></span></div></div>
 <div class="panel"><div class="panelhead"><h3>Insight Content Plan Social Media</h3><small>${SEED.options.month[month-1]} ${year}</small></div><div class="tablewrap" style="box-shadow:none"><table style="min-width:1050px"><thead><tr><th>Tanggal</th><th>Konten</th><th>Format</th><th style="text-align:right">Reach</th><th style="text-align:right">Views</th><th style="text-align:right">Likes</th><th style="text-align:right">Comments</th><th style="text-align:right">Shares</th><th style="text-align:right">Saves</th><th></th></tr></thead><tbody>${contentRows}</tbody></table></div></div>
 <div class="panel" style="margin-top:16px"><div class="panelhead"><h3>Aktivitas Plan Marketing</h3><small>${SEED.options.month[month-1]} ${year}</small></div>${tableContent(campaigns,'marketing')}</div>`;
 $('#applyReportPeriod').onclick=()=>renderReport();
 $('#chartMetric').onchange=()=>{let k=$('#chartMetric').value;$('#dailyChart').innerHTML=dailyInsightChart(completed,year,month,k);$('#chartLegend').textContent=metricLabels[k]+' per hari'};
}
function openInsightForm(index){
 let item=state.ig[index];if(!item||item.workflowStatus!=='Selesai'){alert('Insight hanya bisa diinput untuk konten berstatus Selesai.');return}
 $('#modalTitle').textContent='Input Insight · '+(item.headline||'Content Plan');
 $('#saveBtn').style.display='inline-block';
 let keys=['reach','views','likes','comments','shares','saves'];
 $('#modalBody').innerHTML=`<div class="notice">Metrik ini akan masuk ke Monthly Report sesuai bulan tanggal konten (${fmtDate(item.date)}).</div><div class="formgrid">${keys.map(k=>`<div class="formfield"><label>${k[0].toUpperCase()+k.slice(1)}</label><input type="number" min="0" step="1" id="metric_${k}" value="${Number(item[k])||0}"></div>`).join('')}</div>`;
 $('#modalback').style.display='flex';
 $('#saveBtn').onclick=()=>{keys.forEach(k=>item[k]=Math.max(0,Number($('#metric_'+k).value)||0));closeModal();renderReport()};
}
function renderMetrics(){let total=state.ig.reduce((a,x)=>a+['reach','views','likes','comments','shares','saves'].reduce((b,k)=>b+(Number(x[k])||0),0),0),reach=state.ig.reduce((a,x)=>a+(Number(x.reach)||0),0),likes=state.ig.reduce((a,x)=>a+(Number(x.likes)||0),0),comments=state.ig.reduce((a,x)=>a+(Number(x.comments)||0),0);$('#view').innerHTML=header('Metrics Monthly','Input metrik Instagram dari performa konten. Angka akan diringkas dari data Content Plan.')+`<div class="notice">Isi reach, views, likes, comments, shares, dan saves pada setiap konten. Ringkasan di bawah dihitung otomatis dari data yang tersedia.</div><div class="cards">${stat('Total reach',reach.toLocaleString('id-ID'),'Instagram content plan','◎')}${stat('Total likes',likes.toLocaleString('id-ID'),'Instagram content plan','♡')}${stat('Total comments',comments.toLocaleString('id-ID'),'Instagram content plan','☏')}${stat('Total interaksi',total.toLocaleString('id-ID'),'Penjumlahan metrik terisi','⌁')}</div>${tableContent(state.ig,'content')}`}
function renderSetup(){let s=state.setup;$('#view').innerHTML=header('Template Setup','Atur identitas brand dan preferensi kalender kerja.')+`<div class="setupgrid"><section class="panel"><div class="panelhead"><h3>Pengaturan kalender & brand</h3></div><div class="formgrid"><div class="formfield"><label>Nama brand / akun</label><input id="sBrand" value="${esc(s.brand)}"></div><div class="formfield"><label>Tahun kalender</label><input id="sYear" type="number" value="${s.year}"></div><div class="formfield"><label>Bulan mulai</label><select id="sMonth">${SEED.options.month.map(x=>`<option ${x===s.month?'selected':''}>${x}</option>`).join('')}</select></div><div class="formfield"><label>Awal minggu</label><select id="sWeek"><option ${s.weekStart==='Senin'?'selected':''}>Senin</option><option ${s.weekStart==='Minggu'?'selected':''}>Minggu</option></select></div></div><div class="modalfoot"><button class="btn primary" onclick="saveSetup()">Simpan pengaturan</button></div></section><section class="panel"><div class="panelhead"><h3>Parameter dropdown</h3></div><p class="muted">Pilihan kategori yang mengikuti Template Setup spreadsheet.</p><p><b>Content value</b><br>${SEED.options.value.map(pill).join(' ')}</p><p><b>Format</b><br>${SEED.options.format.map(pill).join(' ')}</p><p><b>Objective</b><br>${SEED.options.objective.map(pill).join(' ')}</p><p><b>Status / jenis plan</b><br>${SEED.options.status.map(pill).join(' ')}</p></section></div><div class="panel" style="margin-top:16px"><div class="panelhead"><h3>Data & penyimpanan</h3></div><p class="muted">Perubahan disimpan otomatis pada browser/perangkat ini. Untuk memindahkan data, gunakan ekspor JSON atau impor backup.</p><div class="toolbar"><button class="btn" onclick="exportData()">↓ Export backup JSON</button><label class="btn" for="importFile">↑ Import backup JSON</label><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"><button class="btn danger" onclick="resetData()">Reset ke data spreadsheet</button></div></div>`}
function saveSetup(){state.setup.brand=$('#sBrand').value;state.setup.year=Number($('#sYear').value)||2026;state.setup.month=$('#sMonth').value;state.setup.weekStart=$('#sWeek').value;save();renderSetup();alert('Pengaturan tersimpan.')}
function fieldsFor(type,item={}){let fields=[];const f=(key,label,kind='text',opts=null,full=false)=>fields.push({key,label,kind,opts,full});if(type==='content'||type==='marketing'){if(type==='content'){f('status','Jenis konten','select',SEED.options.status);f('workflowStatus','Status konten','select',['Planning','On Progress','Review','Selesai'])}else f('type','Jenis marketing','select',['📝 Organik','🗓️ Collaborasi','📑 Endorsement','🟡 Campaign']);f('platform','Platform','select',SEED.options.platform);f('date','Tanggal posting','date');f('time','Jam posting','text');f('value','Content value','select',SEED.options.value);f('format','Content format','select',SEED.options.format);f('objective','Objective','select',SEED.options.objective);f('headline','Headline / Hook');f('caption','Caption','textarea',null,true);f('cta','CTA / CTV');f('hashtag','Hashtag');fields.push({key:'image',label:'Foto / Visual konten',kind:'image',full:true});f('note','Catatan','textarea',null,true);f('link','Link postingan');}else if(type==='marketplace'){f('status','Status campaign','select',['Ide','Persiapan','Berjalan','Selesai','Ditunda']);f('marketplace','Marketplace','select',['Shopee','TikTok Shop','Tokopedia','Lazada','Blibli','Multi-platform']);f('date','Tanggal campaign','date');f('time','Jam mulai / posting');f('campaign','Nama campaign');f('headline','Headline / Tema campaign');f('mechanics','Mekanisme promo','textarea',null,true);f('products','Produk yang dipromosikan');f('budget','Budget campaign');f('objective','Objective');f('link','Link campaign');f('note','Catatan','textarea',null,true);fields.push({key:'image',label:'Materi visual campaign',kind:'image',full:true})}else if(type==='kol'){f('status','Status kerja sama','select',['Prospek','Dihubungi','Negosiasi','Deal','Konten berjalan','Selesai','Tidak lanjut']);f('date','Tanggal posting / tayang','date');f('time','Jam posting');f('creator','Nama KOL / Affiliate');f('platform','Platform','select',['Instagram','TikTok','YouTube','Multi-platform']);f('type','Jenis kerja sama','select',['KOL','Affiliate','UGC Creator','KOL + Affiliate']);f('headline','Campaign / Produk');f('deliverables','Deliverables','textarea',null,true);f('fee','Fee / Komisi');f('contact','Kontak');f('link','Link akun / konten');f('note','Catatan','textarea',null,true);fields.push({key:'image',label:'Foto / Brief visual',kind:'image',full:true})}else{f('status','Content implementation','select',['Referensi','Modifikasi','Ikutin Trend','Di Implementasikan','Terinspirasi','Reject','Bank Idea']);f('platform','Platform','select',SEED.options.platform);f('value','Content value','select',SEED.options.value);f('format','Jenis konten','select',SEED.options.format);f('headline','Headline / Hook');f('source','Sumber akun');f('niche','Niche account');f('message','Key message','textarea',null,true);f('url','Link postingan')};return fields.map(x=>`<div class="formfield ${x.full?'full':''}"><label>${x.label}</label>${x.kind==='image'?`<div style="border:1.5px dashed #e7cdb6;border-radius:11px;padding:14px;background:#fffaf5"><label for="imageUpload" style="display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#a65a20;font-weight:700;padding:10px">＋ Drop foto / klik untuk insert foto</label><input id="imageUpload" name="imageUpload" type="file" accept="image/*" style="width:100%;font-size:11px"><div id="imagePreview" style="margin-top:10px">${item.image?`<img src="${esc(item.image)}" style="max-width:100%;max-height:220px;display:block;border-radius:8px;object-fit:contain"><small class="muted">Foto saat ini</small>`:'<small class="muted">Belum ada foto dipilih. Foto akan tampil di preview plan.</small>'}</div><button type="button" class="btn small danger" style="margin-top:8px" onclick="clearSelectedImage()">Hapus foto</button></div>`:x.kind==='select'?`<select name="${x.key}"><option value="">Pilih...</option>${([...new Set([...(item[x.key]&&!x.opts.includes(item[x.key])?[item[x.key]]:[]),...x.opts])]).map(o=>`<option ${item[x.key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:x.kind==='textarea'?`<textarea name="${x.key}">${esc(item[x.key]||'')}</textarea>`:`<input name="${x.key}" type="${x.kind}" value="${esc(item[x.key]??'')}">`}</div>`).join('')}

function openForm(type,index=null,date=null){activeType=type;activeEdit=index;removeCurrentImage=false;let item=index!==null?(type==='content'?state.ig:state[type])[index]:{};if(date)item={...item,date};$('#modalTitle').textContent=(index===null?'Tambah ':'Edit ')+(type==='content'?'Content Plan Social Media':type==='marketing'?'marketing plan':type==='marketplace'?'Marketplace Plan':type==='kol'?'KOL & Affiliate Plan':'ide konten');$('#modalBody').innerHTML=`<form id="editForm" class="formgrid">${fieldsFor(type,item)}</form>`;$('#modalback').style.display='flex';$('#saveBtn').style.display='inline-block';let upload=$('#imageUpload');if(upload)upload.onchange=()=>{removeCurrentImage=false;showSelectedImage(upload.files[0])};$('#saveBtn').onclick=()=>{let obj={...item};let form=$('#editForm');new FormData(form).forEach((v,k)=>{if(k!=='imageUpload')obj[k]=v});if(removeCurrentImage)obj.image='';let file=$('#imageUpload')?.files?.[0];const commit=()=>{let arr=type==='content'?state.ig:state[type];if(index===null)arr.unshift(obj);else arr[index]=obj;closeModal();render()};if(file){resizeImage(file).then(data=>{obj.image=data;commit()}).catch(()=>alert('Foto gagal diproses. Coba pilih foto lain.'))}else commit()}}
function showSelectedImage(file){if(!file)return;let preview=$('#imagePreview');if(!preview)return;let url=URL.createObjectURL(file);preview.innerHTML=`<img src="${url}" style="max-width:100%;max-height:220px;display:block;border-radius:8px;object-fit:contain"><small class="muted">Preview foto yang akan disimpan</small>`}
function clearSelectedImage(){removeCurrentImage=true;let input=$('#imageUpload');if(input)input.value='';let preview=$('#imagePreview');if(preview)preview.innerHTML='<small class="muted">Foto dihapus. Simpan form untuk menerapkan perubahan.</small>'}
function resizeImage(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let scale=Math.min(1,1400/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82))};img.src=reader.result};reader.readAsDataURL(file)})}

function safeWebUrl(raw){try{let u=new URL(raw);return ['http:','https:'].includes(u.protocol)?u.href:null}catch(e){return null}}
function openDayPreview(date){
 let items=allCalendarPlans().filter(x=>x.date===date);
 if(!items.length){openForm('marketing',null,date);return}
 $('#modalTitle').textContent='Preview Plan · '+fmtDate(date);
 $('#saveBtn').style.display='none';
 $('#modalBody').innerHTML=items.map((x,n)=>{
   let link=safeWebUrl(x.link||x.url), image=(typeof x.image==='string'&&x.image.startsWith('data:image/'))?x.image:safeWebUrl(x.image);
   let kindLabel=x._kind==='content'?'Content Plan Social Media':x._kind==='marketplace'?'Marketplace Plan':x._kind==='kol'?'KOL & Affiliate Plan':'Plan Marketing';
   let details=[['Kategori plan',kindLabel],['Status konten',x.workflowStatus],['Jenis / Status',x.type||x.status],['Platform',x.platform||x.marketplace],['Jam posting',x.time],['Content value',x.value],['Format',x.format],['Objective',x.objective],['Nama campaign',x.campaign],['Mekanisme promo',x.mechanics],['Produk',x.products],['Nama KOL / Affiliate',x.creator],['Deliverables',x.deliverables],['Fee / Budget',x.fee||x.budget],['Caption',x.caption],['CTA',x.cta],['Hashtag',x.hashtag],['Catatan',x.note]]
    .filter(pair=>pair[1]!==undefined&&pair[1]!==null&&String(pair[1]).trim()!=='');
   return `<section class="panel" style="box-shadow:none;margin-bottom:12px;padding:15px">
    <div class="panelhead"><div><div style="font-size:10px;color:#968b7e;margin-bottom:4px">PLAN ${n+1} · ${kindLabel}</div><h3>${esc(x.headline||x.campaign||x.creator||x.type||kindLabel)}</h3></div>${pill(x.type||x.status||kindLabel)}</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">${x.platform?pill(x.platform):''}${x.format?pill(x.format):''}${x.objective?pill(x.objective):''}</div>
    ${image?`<div style="margin-bottom:12px"><a href="${esc(image)}" target="_blank" rel="noopener noreferrer"><img src="${esc(image)}" alt="Preview visual" style="max-width:100%;max-height:210px;object-fit:contain;border-radius:9px;background:#faf7f2"></a></div>`:''}
    <div class="formgrid">${details.map(([k,v])=>`<div class="formfield ${['Caption','Catatan','Mekanisme promo','Deliverables'].includes(k)?'full':''}"><label>${esc(k)}</label><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(v)}</div></div>`).join('')}</div>
    <div class="toolbar" style="margin-bottom:0">
      ${link?`<a class="btn soft" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Buka link ↗</a>`:`<span class="muted" style="font-size:11px">Belum ada link</span>`}
      <button class="btn small" onclick="closeModal();openForm('${x._kind}',${x._index})">Edit plan</button>
    </div>
   </section>`;
 }).join('');
 $('#modalback').style.display='flex';
}
function closeModal(){$('#modalback').style.display='none';$('#saveBtn').style.display='inline-block'}
function editItem(type,i){openForm(type,i)}
function deleteItem(type,i){if(!confirm('Hapus item ini?'))return;let arr=type==='content'?state.ig:state[type];arr.splice(i,1);render()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gadoeh-rasa-marketing-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.marketing||!d.bank)throw Error('Format tidak sesuai');state=d;state.marketplace=state.marketplace||[];state.kol=state.kol||[];save();render();alert('Backup berhasil diimpor.')}catch(err){alert('File backup tidak valid.')}};r.readAsText(f)}
function resetData(){if(!confirm('Kembalikan data ke kondisi awal dari spreadsheet? Semua perubahan lokal akan hilang.'))return;state={...SEED,ig:SEED.ig.slice(),marketing:SEED.marketing.slice(),marketplace:[],kol:[],bank:SEED.bank.slice()};save();render()}
initAuthControls();render();initSupabase();
</script></body></html>
